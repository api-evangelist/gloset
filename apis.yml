name: Gloset
description: Gloset is a Mexican peer-to-peer marketplace for buying and selling pre-owned and new fashion
  — formal dresses, casual wear, handbags, accessories, footwear, jewelry, watches, sportswear, menswear,
  and swimwear. The platform offers a seller authentication program, curated collections and trending
  edits, buyer protection with returns and refunds, and integrated payments and shipping, operating
  primarily in Mexico. Gloset is backed by 500 Global. As of this profile the company publishes no public
  developer API, API reference, or technical documentation surface — it is a consumer marketplace web/app
  product.
